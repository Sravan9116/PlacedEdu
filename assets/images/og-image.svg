<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031827"/>
      <stop offset="60%" stop-color="#052B45"/>
      <stop offset="100%" stop-color="#062238"/>
    </linearGradient>
    <linearGradient id="og-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11D1C1"/>
      <stop offset="100%" stop-color="#19B9C4"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#19B9C4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#031827" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#19B9C4" stroke-opacity="0.08" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>

  <!-- Brand Mark -->
  <g transform="translate(100, 90)">
    <rect width="54" height="54" rx="14" fill="#062238" stroke="#19B9C4" stroke-width="1.5"/>
    <path d="M 27,27 C 22,17 14,17 10,27 C 14,37 22,37 27,27 C 32,17 40,17 44,27 C 40,37 32,37 27,27 Z" stroke="rgba(25, 185, 196, 0.25)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 27,27 C 22,17 14,17 10,27 C 14,37 22,37 27,27 C 32,17 40,17 44,27 C 40,37 32,37 27,27 Z" stroke="url(#og-teal)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="38" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.04em" fill="#FFFFFF">PLACED</text>
  </g>

  <!-- Tagline Eyebrow -->
  <text x="100" y="210" font-family="'DM Sans', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="0.2em" fill="#11D1C1" text-transform="uppercase">
