    <text x="24" y="44" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" letter-spacing="0.1em" fill="#11D1C1">PLACED OS / LIVE</text>
    <circle cx="280" cy="40" r="5" fill="#11D1C1"/>
    
    <text x="24" y="90" font-family="'DM Sans', sans-serif" font-size="13" fill="#A4B3C2">Communication Readiness</text>
    <rect x="24" y="102" width="270" height="8" rx="4" fill="#031827"/>
    <rect x="24" y="102" width="248" height="8" rx="4" fill="url(#og-teal)"/>
    <text x="260" y="90" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">92%</text>

    <text x="24" y="150" font-family="'DM Sans', sans-serif" font-size="13" fill="#A4B3C2">Aptitude Benchmarking</text>
    <rect x="24" y="162" width="270" height="8" rx="4" fill="#031827"/>
    <rect x="24" y="162" width="226" height="8" rx="4" fill="url(#og-teal)"/>
    <text x="260" y="150" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">84%</text>

    <text x="24" y="210" font-family="'DM Sans', sans-serif" font-size="13" fill="#A4B3C2">Mock Interview Simulation</text>
    <rect x="24" y="222" width="270" height="8" rx="4" fill="#031827"/>
    <rect x="24" y="222" width="205" height="8" rx="4" fill="url(#og-teal)"/>
    <text x="260" y="210" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">76%</text>

    <line x1="24" y1="260" x2="294" y2="260" stroke="#052B45"/>
    <text x="24" y="295" font-family="'DM Sans', sans-serif" font-size="13" fill="#65778A">Next milestone:</text>
    <text x="24" y="315" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#11D1C1">Recruitment Simulation →</text>
