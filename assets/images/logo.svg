<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48" fill="none" class="placed-logo-svg">
  <defs>
    <linearGradient id="logo-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11D1C1"/>
      <stop offset="100%" stop-color="#19B9C4"/>
    </linearGradient>
    <linearGradient id="logo-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052B45"/>
      <stop offset="100%" stop-color="#031827"/>
    </linearGradient>
  </defs>
  <!-- Icon Mark (Infinite Symbol) -->
  <g transform="translate(4, 4)">
    <rect width="40" height="40" rx="10" fill="url(#logo-navy)"/>
    <path d="M 20,20 C 16,12 10,12 7,20 C 10,28 16,28 20,20 C 24,12 30,12 33,20 C 30,28 24,28 20,20 Z" stroke="rgba(25, 185, 196, 0.25)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 20,20 C 16,12 10,12 7,20 C 10,28 16,28 20,20 C 24,12 30,12 33,20 C 30,28 24,28 20,20 Z" stroke="url(#logo-teal)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Wordmark -->
  <text x="56" y="29" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.04em" fill="currentColor">
    PLACED
  </text>
  <!-- Indicator Dot -->
  <circle cx="152" cy="24" r="3" fill="#19B9C4"/>
  <!-- Subtitle / Micro tagline -->
  <text x="57" y="39" font-family="'DM Sans', system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.16em" fill="#65778A" text-transform="uppercase">
    READINESS OS
  </text>
</svg>
